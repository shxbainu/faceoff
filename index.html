<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Faceoff</title>
<link rel="icon" href="data:," />
<style>
  :root { --bg: #14171d; --bg2: #232830; --line: #3a424e; --dim: #9aa3b0; --text: #eef1f4; --accent: #e5482d;
    --font: "Archivo", system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0f13; color: var(--text);
    font-family: var(--font); font-weight: 500; user-select: none; }
  b, strong { font-weight: 800; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .panel { background: var(--bg); border: 2px solid var(--line); border-radius: 4px; }

  /* Heat */
  #heat { position: absolute; left: 16px; top: 16px; padding: 8px 12px; width: 216px; }
  #heat .row { display: flex; align-items: baseline; justify-content: space-between; }
  #heat .lbl { font-size: 12px; color: var(--dim); }
  #mult { font-weight: 800; font-size: 20px; line-height: 24px; }
  #heatbar { position: relative; height: 8px; background: var(--bg2); overflow: hidden; margin: 4px 0 8px; }
  #heatfill { height: 100%; width: 0; background: var(--accent); transition: width .12s; }
  #heatbar s { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--bg); }
  #buffs { font-size: 12px; line-height: 16px; }
  #style { font-size: 12px; line-height: 16px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #heat.fire { border-color: var(--accent); }
  #heat.bump #mult { animation: bump .25s ease-out; }
  @keyframes bump { from { transform: scale(1.5); } }

  /* power stack */
  #stack { position: absolute; right: 16px; top: 16px; display: flex; gap: 8px; }
  .pw { width: 36px; height: 36px; border-radius: 4px; display: grid; place-items: center; position: relative; color: var(--bg); }
  .pw svg { width: 20px; height: 20px; }
  .pw b { position: absolute; right: -4px; bottom: -4px; background: var(--bg); color: var(--text); font-size: 12px; line-height: 16px;
    min-width: 16px; text-align: center; border-radius: 4px; }

  /* scoreboard */
  #boardwrap { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); text-align: center; }
  #banner { display: inline-block; font-size: 12px; line-height: 16px; color: var(--dim); background: var(--bg); padding: 4px 12px 0; border-radius: 4px 4px 0 0; }
  #board { display: flex; align-items: center; gap: 12px; padding: 8px 16px; font-weight: 800; font-size: 28px; line-height: 32px; font-variant-numeric: tabular-nums; }
  #board .chip { width: 16px; height: 16px; border-radius: 2px; }
  #board .code { font-weight: 500; font-size: 16px; }
  #clock { min-width: 56px; background: var(--bg2); border-radius: 4px; padding: 0 8px; font-size: 20px; }
  #clock.ot { background: var(--accent); }

  /* score popups */
  #pops { position: absolute; inset: 0; }
  .pop { position: absolute; font-weight: 800; font-size: 16px; white-space: nowrap; color: var(--text);
    -webkit-text-stroke: 4px var(--bg); paint-order: stroke fill; animation: rise .9s ease-out forwards; }
  .pop.big, .pop.md { font-size: 24px; }
  .pop.lg { font-size: 32px; -webkit-text-stroke: 6px var(--bg); animation-duration: 1.25s; }
  /* punch in (scaled by intensity via --k), hold, then rise out */
  @keyframes rise { 0% { opacity: 0; transform: translate(-50%, -40%) scale(calc(1 + .7 * var(--k, 1))); }
    10% { opacity: 1; transform: translate(-50%, -80%) scale(1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -180%); } }

  /* feedback layers: a white flash (capped at 0.32, at most ~3 a second) and a dark vignette, both driven per frame */
  #fxflash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #fxvig { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 52%, rgba(0,0,0,.9) 100%); }

  /* flow rank and pass streak (top right, under the power stack) */
  #flow { position: absolute; right: 16px; top: 64px; width: 152px; padding: 8px 12px; }
  #flow .row { display: flex; align-items: baseline; justify-content: space-between; }
  #flow .lbl { font-size: 12px; color: var(--dim); }
  #rank { font-weight: 800; font-size: 28px; line-height: 32px; display: inline-block; }
  #rank.up { animation: bump .3s ease-out; }
  #flow.hot { border-color: var(--accent); }
  #flowbar { height: 4px; background: var(--bg2); margin: 4px 0 0; }
  #flowbar i { display: block; height: 100%; width: 0; background: var(--text); }
  #streak { display: none; margin-top: 8px; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  #streak.on { display: flex; }
  #streak b { font-size: 16px; line-height: 20px; }
  #streak.up.kick b { animation: bump .22s ease-out; }
  #streak.broken { color: var(--dim); animation: fade 1.1s ease-in forwards; }
  #streak.broken.kick b { animation: jolt .3s ease-out; }
  #streak.cashed { animation: fade 1.1s ease-in forwards; }
  #pips { display: flex; gap: 4px; flex-basis: 100%; }
  #pips i { width: 12px; height: 4px; background: var(--text); }
  #streak.broken #pips i { background: var(--line); }
  @keyframes jolt { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  @keyframes fade { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }

  /* goal card: slams in above the scoreboard (clear of the net and the puck); J skips the celebration */
  #goalcard { position: absolute; left: 50%; bottom: 112px; transform: translate(-50%, 0); background: var(--bg); border-left: 8px solid var(--accent);
    border-radius: 4px; padding: 8px 24px 8px 16px; opacity: 0; pointer-events: none; white-space: nowrap; }
  #goalcard b { display: block; font-size: 48px; line-height: 52px; }
  #goalcard small { display: block; font-size: 14px; line-height: 20px; color: var(--dim); min-height: 20px; }
  #goalcard kbd, #goalcard .hint { display: none; font-size: 12px; color: var(--dim); }
  #goalcard.skip kbd, #goalcard.skip .hint { display: inline-block; margin-top: 4px; }
  #goalcard kbd { padding: 0 4px; margin-right: 4px; }
  #goalcard.on { opacity: 1; animation: slam .18s ease-out; }
  @keyframes slam { from { transform: translate(-50%, 0) scale(1.35); opacity: .2; } to { transform: translate(-50%, 0) scale(1); opacity: 1; } }

  /* feel settings (P) and feedback debug (`) */
  #feel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 400px; padding: 16px 20px; display: none; pointer-events: auto; }
  #feel.on { display: block; }
  #feel h3, #fxdbg h3 { margin: 0 0 8px; font-weight: 800; font-size: 16px; }
  #feel .fr { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 4px 8px; border-radius: 4px; font-size: 14px; line-height: 24px; }
  #feel .fr.sel { background: var(--bg2); }
  #feel .fr b { min-width: 64px; text-align: right; white-space: nowrap; }
  #feel .bar { display: inline-block; width: 96px; height: 4px; background: var(--line); margin-right: 8px; vertical-align: middle; }
  #feel .bar i { display: block; height: 100%; background: var(--text); }
  #feel p, #fxdbg p { font-size: 12px; color: var(--dim); margin: 8px 0 0; }
  #fxdbg { position: absolute; left: 16px; top: 150px; width: 320px; padding: 8px 12px; display: none; font-size: 12px; line-height: 16px; }
  #fxdbg.on { display: block; }
  #fxdbg .dk { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; }
  #fxdbg kbd { padding: 0 4px; }
  #fxdbg pre { margin: 8px 0 0; font: inherit; color: var(--dim); white-space: pre-wrap; max-height: 220px; overflow: hidden; }

  #you { position: absolute; transform: translate(-50%, -100%); background: #1e90ff; color: #fff; border-radius: 2px;
    font-weight: 800; font-size: 12px; line-height: 16px; padding: 0 8px; display: none; }
  /* sprint bar: blue, brighter while sprinting, red and pulsing when winded; the tick marks where it unlocks again */
  #sprint { position: absolute; width: 64px; height: 7px; background: var(--bg); border: 2px solid var(--bg); border-radius: 4px;
    transform: translate(-50%, 0); display: none; overflow: hidden; pointer-events: none; }
  #sprint i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #3d8bff; border-radius: 2px; }
  #sprint s { position: absolute; left: 35%; top: 0; bottom: 0; width: 2px; background: var(--bg); opacity: 0; }
  #sprint.on i { background: #8fd0ff; }
  #sprint.gassed i { background: #e5482d; animation: gas .5s ease-in-out infinite alternate; }
  #sprint.gassed s { opacity: 1; }
  @keyframes gas { from { opacity: 1; } to { opacity: .45; } }
  /* ability chip under your skater: key, name, a cooldown line along its bottom; it steps up once when ready */
  #abil { position: absolute; transform: translate(-50%, 0); display: none; pointer-events: none; height: 16px;
    padding: 0 4px 0 0; background: var(--bg); border: 2px solid var(--line); border-radius: 4px; overflow: hidden;
    font-size: 11px; line-height: 16px; color: var(--dim); white-space: nowrap; }
  #abil b { display: inline-block; width: 16px; margin-right: 4px; text-align: center; font-weight: 800; background: var(--bg2); color: var(--dim); }
  #abil i { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: var(--dim); }
  #abil.ready { border-color: var(--dim); color: var(--text); }
  #abil.ready b { color: var(--text); background: var(--line); }
  #abil.live { border-color: var(--text); }
  #abil.pop { animation: abpop .32s cubic-bezier(.16, 1, .3, 1); }
  @keyframes abpop { from { transform: translate(-50%, 0) scale(.86); } to { transform: translate(-50%, 0) scale(1); } }
  /* shot wind-up */
  #wind { position: absolute; width: 72px; height: 8px; background: var(--bg); border: 2px solid var(--bg); border-radius: 2px;
    transform: translate(-50%, 0); display: none; overflow: hidden; }
  #wind i { position: absolute; left: 21%; width: 34%; top: 0; bottom: 0; background: var(--line); }
  #wind u { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: var(--text); }

  /* calls: goal, on fire, faceoff */
  #flash { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); background: var(--bg); border-left: 8px solid var(--accent);
    border-radius: 4px; padding: 8px 24px 8px 16px; font-weight: 800; font-size: 36px; line-height: 40px; opacity: 0; transition: opacity .12s;
    white-space: nowrap; text-align: left; }
  #flash small { display: block; font-weight: 500; font-size: 14px; line-height: 20px; color: var(--dim); }
  #flash.on { opacity: 1; }

  /* full-screen cards */
  #overlay { position: absolute; inset: 0; display: none; place-items: center; background: rgba(13, 15, 19, .82); text-align: center; }
  #overlay.on { display: grid; }
  #overlay > div { background: var(--bg); border: 2px solid var(--line); border-radius: 8px; padding: 32px 40px; }
  #overlay h1 { font-weight: 800; font-size: 64px; line-height: 64px; margin: 0 0 12px; }
  #overlay h1::after { content: ""; display: block; width: 64px; height: 8px; background: var(--accent); margin: 12px auto 0; }
  #overlay h2 { font-weight: 800; font-size: 36px; line-height: 40px; margin: 8px 0; }
  #overlay p { font-size: 16px; margin: 8px auto; max-width: 620px; line-height: 24px; color: var(--dim); }
  #overlay p b { color: var(--text); }
  kbd { background: var(--bg2); color: var(--text); border: 2px solid var(--line); border-radius: 4px; padding: 0 8px; font-family: inherit; font-weight: 800; }
  .keys { display: grid; grid-template-columns: auto auto; gap: 8px 16px; justify-content: center; text-align: left; margin: 16px auto; font-size: 16px; }
  .go { display: inline-block; margin-top: 16px; font-weight: 800; font-size: 16px; line-height: 24px; background: var(--text); color: var(--bg); border-radius: 4px; padding: 4px 16px; }
  .tag { font-size: 12px; line-height: 16px; color: var(--dim); }
  .vs { display: flex; gap: 20px; align-items: center; justify-content: center; margin: 12px 0; font-weight: 800; font-size: 32px; }
  .vs .chip { width: 32px; height: 32px; border-radius: 4px; }
  .vs i { font-style: normal; font-weight: 500; font-size: 20px; color: var(--dim); }
  .cards { display: flex; gap: 16px; justify-content: center; margin: 16px 0; }
  .card { width: 208px; padding: 16px 12px; border-radius: 4px; background: var(--bg2); border: 2px solid var(--line); }
  .card .ic { width: 56px; height: 56px; border-radius: 4px; margin: 0 auto 12px; display: grid; place-items: center; background: var(--c); color: var(--bg); }
  .card .ic svg { width: 32px; height: 32px; }
  .card h3 { margin: 4px 0; font-weight: 800; font-size: 20px; line-height: 24px; }
  .card .lv { font-size: 12px; color: var(--dim); }
  .card p { font-size: 14px; line-height: 20px; min-height: 60px; }
  .stats { display: grid; grid-template-columns: 72px 192px 72px; gap: 4px 8px; justify-content: center; margin: 12px auto; font-variant-numeric: tabular-nums; }
  .stats span:nth-child(3n+2) { font-size: 14px; color: var(--dim); align-self: center; }
  .stats span:nth-child(3n+1), .stats span:nth-child(3n) { font-weight: 800; font-size: 20px; }
  .row2 { display: flex; gap: 8px; justify-content: center; align-items: center; min-height: 44px; font-size: 14px; color: var(--dim); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div id="pops"></div>
  <div id="wind"><i></i><u></u></div>
  <div id="sprint"><i></i><s></s></div>
  <div id="abil"><b>O</b><span></span><i></i></div>
  <div id="you">You</div>
  <div id="heat" class="panel"><div class="row"><span class="lbl">Heat</span><span id="mult">x1</span></div>
    <div id="heatbar"><div id="heatfill"></div><s style="left:25%"></s><s style="left:50%"></s><s style="left:75%"></s></div><div id="buffs">No bonus yet</div><div id="style">Style 0</div></div>
  <div id="stack"></div>
  <div id="boardwrap"><div id="banner">Round 1 · first to 3</div>
    <div id="board" class="panel"><span class="chip" id="c0"></span><span class="code" id="n0">KWT</span><span id="s0">0</span>
      <span id="clock">1:30</span><span id="s1">0</span><span class="code" id="n1">PFR</span><span class="chip" id="c1"></span></div></div>
  <div id="flash"></div>
  <div id="overlay"></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
